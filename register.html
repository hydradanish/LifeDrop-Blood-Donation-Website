<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
    <script src="lifedrop.js" defer></script>
    
</head>


<body>
    <a class="heading" href="index.html">🩸LifeDrop</a>
    <p style="margin-left: 49px;">Donate Blood Save Lifes</p>

    <ul class="navbar">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="Appointment.html">Appointment Slots</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="medical.html">Medical checks</a></li>
        <li><a href="collection.html">Collection queues</a></li>
    </ul>
    <p class="dore">Donor Registration</p>
    <p style="margin-left: 600px; font-weight: lighter;">Fill in your details to register for the camp.</p>
    <div class="registration-container">

        <form id="donorForm">

            <label>Full Name</label>
            <input type="text"  name="fullname" placeholder="Enter your full name" required>

            <div class="form-row">
                <div>
                    <label>Age</label>
                    <input type="number"  name="age" placeholder="Enter age" min="18" max="65" required>
                </div>

                <div>
                    <label>Blood Group</label>
                    <select name="bloodgroup" required>
                        <option value="">Select group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                    </select>
                </div>
            </div>

            <label>Phone Number</label>
            <input type="tel"  name="phone" placeholder="Enter phone number" maxlength="10" pattern="[0-9]{10}" inputmode="numeric"
                required>

            <label>Email Address</label>
            <input type="email"  name="email" placeholder="Enter email address" required>

            <label>Preferred Date</label>
            <input type="date" name="date" required>

            <button type="submit" class="register-btn">
                Submit Registration
            </button>

        </form>

    </div>

</body>

</html>
